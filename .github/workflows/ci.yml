name: Test and deploy

# Every push to main (and every pull request) runs the tests: the unit tests,
# then two people in a browser against the Firebase emulators with a pretend
# Claude. Nothing in them touches the real database or the Claude API.
# Only when they pass, and only on main, is the app published: the site
# (https://kids-presents.web.app), the database rules and the functions.
# The ANTHROPIC_API_KEY secret is set once in Cloud Shell (see the README).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/copy-shared.mjs && npm --prefix functions ci
      - run: npm test
      - name: End to end, against the emulators
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          npx -y firebase-tools@15 emulators:exec --only auth,firestore --project kids-presents 'node test/e2e.mjs'
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: screenshots, path: test/shots, retention-days: 7 }

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm --prefix functions ci
      - name: Service account key
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
      # --force: answer yes to the CLI's questions (e.g. the container image clean-up policy).
      - run: npx -y firebase-tools@15 deploy --only hosting,firestore,functions --project kids-presents --non-interactive --force
        env: { GOOGLE_APPLICATION_CREDENTIALS: "${{ runner.temp }}/sa.json" }
