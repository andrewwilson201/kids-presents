name: Deploy functions

# Redeploys the Firebase functions (reading invites, Claude's ideas, the daily
# reminders, the calendar feed) whenever code they use changes on main. The
# ANTHROPIC_API_KEY secret is set once in Cloud Shell (see the README).
on:
  push:
    branches: [main]
    paths:
      - functions/**
      - js/gifts.js
      - tools/copy-shared.mjs
      - firebase.json
      - .github/workflows/deploy-functions.yml
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm --prefix functions ci
      - name: Service account key
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
      # --force: answer yes to the CLI's questions (e.g. the container image clean-up policy).
      - run: npx -y firebase-tools@15 deploy --only functions --project kids-presents --non-interactive --force
        env: { GOOGLE_APPLICATION_CREDENTIALS: "${{ runner.temp }}/sa.json" }
