name: Tests

# Runs every test on each pull request (and on main): the unit tests, and the
# end-to-end run (two people in a browser against the Firebase emulators, with
# a pretend Claude). Nothing here touches the real database or the Claude API.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/copy-shared.mjs && npm --prefix functions ci
      - run: npm test
      - name: End to end, against the emulators
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          npx -y firebase-tools@15 emulators:exec --only auth,firestore --project kids-presents 'node test/e2e.mjs'
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: screenshots, path: test/shots, retention-days: 7 }
