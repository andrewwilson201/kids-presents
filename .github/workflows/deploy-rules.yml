name: Deploy database rules

# Publishes firestore.rules (and the indexes) whenever they change on main,
# so the live rules always match this repo.
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - .github/workflows/deploy-rules.yml
  workflow_dispatch:

concurrency:
  group: deploy-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Service account key
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
      - run: npx -y firebase-tools@15 deploy --only firestore --project kids-presents --non-interactive
        env: { GOOGLE_APPLICATION_CREDENTIALS: "${{ runner.temp }}/sa.json" }
